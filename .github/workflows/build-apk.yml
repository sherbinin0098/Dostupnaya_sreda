name: Сборка APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Подготовка веб-части
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Установка зависимостей
        run: npm install --no-audit --no-fund

      - name: Создание Android-проекта
        run: npx cap add android

      - name: Разрешение камеры и номер версии
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n</manifest>#' "$MANIFEST"
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle
          grep -n "CAMERA" "$MANIFEST"

      - name: Иконка приложения
        continue-on-error: true
        run: |
          command -v magick || command -v convert || (sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick)
          IM=$(command -v magick || command -v convert)
          RES=android/app/src/main/res
          rm -rf "$RES/mipmap-anydpi-v26"
          for pair in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d=${pair%%:*}; px=${pair##*:}
            "$IM" icon-512.png -resize ${px}x${px} "$RES/mipmap-$d/ic_launcher.png"
            cp "$RES/mipmap-$d/ic_launcher.png" "$RES/mipmap-$d/ic_launcher_round.png"
            rm -f "$RES/mipmap-$d/ic_launcher_foreground.png"
          done

      - name: Постоянный ключ подписи (чтобы приложение обновлялось поверх)
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Синхронизация веб-части
        run: npx cap sync android

      - name: Сборка APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Подготовка файла
        run: cp android/app/build/outputs/apk/debug/app-debug.apk gorynych-dostupnost.apk

      - uses: actions/upload-artifact@v4
        with:
          name: gorynych-dostupnost-apk
          path: gorynych-dostupnost.apk

      - name: Публикация в Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Сборка ${{ github.run_number }}
          body: "APK: gorynych-dostupnost.apk. Нормы: СП 59.13330.2020, СП 140.13330.2024."
          files: gorynych-dostupnost.apk
