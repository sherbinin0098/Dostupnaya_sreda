name: Сборка APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SIDELOAD_PASSWORD: ${{ secrets.SIDELOAD_PASSWORD }}
      UPLOAD_PASSWORD: ${{ secrets.UPLOAD_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Подготовка веб-части
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Установка зависимостей
        run: npm install --no-audit --no-fund

      - name: Создание Android-проекта
        run: npx cap add android

      - name: Разрешение камеры и номер версии
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n</manifest>#' "$MANIFEST"
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle
          grep -n "CAMERA" "$MANIFEST"

      - name: Иконка приложения (адаптивная, синий фон и символ)
        run: |
          command -v magick || command -v convert || (sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick)
          IM=$(command -v magick || command -v convert)
          RES=android/app/src/main/res
          BG="#01318A"
          # символ без фона (фон убирается по цвету)
          "$IM" icon.png -fuzz 18% -transparent "rgb(1,49,136)" -fuzz 18% -transparent "rgb(12,49,136)" "$RUNNER_TEMP/fg.png"
          for pair in mdpi:48:108 hdpi:72:162 xhdpi:96:216 xxhdpi:144:324 xxxhdpi:192:432; do
            IFS=: read d px fgpx <<< "$pair"
            # старые Android: готовая картинка целиком
            "$IM" icon.png -resize ${px}x${px} "$RES/mipmap-$d/ic_launcher.png"
            cp "$RES/mipmap-$d/ic_launcher.png" "$RES/mipmap-$d/ic_launcher_round.png"
            # Android 8+: символ на 86% холста 108dp, чтобы влезал в безопасную зону маски
            inner=$(( fgpx * 86 / 100 ))
            "$IM" "$RUNNER_TEMP/fg.png" -resize ${inner}x${inner} -background none -gravity center -extent ${fgpx}x${fgpx} "$RES/mipmap-$d/ic_launcher_foreground.png"
          done
          cat > "$RES/values/ic_launcher_background.xml" <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">$BG</color>
          </resources>
          EOF
          ls "$RES/mipmap-anydpi-v26/"
          cat "$RES/mipmap-anydpi-v26/ic_launcher.xml"

      - name: Ключи подписи из секретов GitHub
        env:
          SIDELOAD_KEYSTORE: ${{ secrets.SIDELOAD_KEYSTORE }}
          UPLOAD_KEYSTORE: ${{ secrets.UPLOAD_KEYSTORE }}
        run: |
          if [ -z "$SIDELOAD_KEYSTORE" ] || [ -z "$SIDELOAD_PASSWORD" ]; then
            echo "::error::Нет секретов SIDELOAD_KEYSTORE / SIDELOAD_PASSWORD (Settings - Secrets and variables - Actions)"
            exit 1
          fi
          echo "$SIDELOAD_KEYSTORE" | base64 -d > "$RUNNER_TEMP/sideload.jks"
          echo "SIDELOAD_KEYSTORE_FILE=$RUNNER_TEMP/sideload.jks" >> "$GITHUB_ENV"
          if [ -n "$UPLOAD_KEYSTORE" ] && [ -n "$UPLOAD_PASSWORD" ]; then
            echo "$UPLOAD_KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "UPLOAD_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          fi
          cat >> android/app/build.gradle <<'EOF'

          android {
              signingConfigs {
                  sideload {
                      storeFile file(System.getenv('SIDELOAD_KEYSTORE_FILE'))
                      storePassword System.getenv('SIDELOAD_PASSWORD')
                      keyAlias 'sideload'
                      keyPassword System.getenv('SIDELOAD_PASSWORD')
                  }
                  if (System.getenv('UPLOAD_KEYSTORE_FILE')) {
                      play {
                          storeFile file(System.getenv('UPLOAD_KEYSTORE_FILE'))
                          storePassword System.getenv('UPLOAD_PASSWORD')
                          keyAlias 'upload'
                          keyPassword System.getenv('UPLOAD_PASSWORD')
                      }
                  }
              }
              buildTypes {
                  release {
                      // APK для установки из файла: ключ sideload; AAB для Play (-Pupload): ключ загрузки
                      signingConfig project.hasProperty('upload') ? signingConfigs.play : signingConfigs.sideload
                  }
              }
              lint {
                  abortOnError false
                  checkReleaseBuilds false
              }
          }
          EOF

      - name: Синхронизация веб-части
        run: npx cap sync android

      - name: Сборка APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Подготовка файла
        run: cp android/app/build/outputs/apk/release/app-release.apk gorynych-dostupnost.apk

      - name: Пакет для Google Play (AAB, ключ загрузки)
        if: env.UPLOAD_KEYSTORE_FILE != ''
        working-directory: android
        run: |
          ./gradlew bundleRelease -Pupload --no-daemon
          cp app/build/outputs/bundle/release/app-release.aab ../gorynych-dostupnost-google-play.aab

      - name: Проверка подписи ключом из секрета
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          EXPECTED=$(keytool -exportcert -alias sideload -keystore "$SIDELOAD_KEYSTORE_FILE" -storepass:env SIDELOAD_PASSWORD | sha256sum | cut -d' ' -f1)
          ACTUAL=$("$APKSIGNER" verify --print-certs gorynych-dostupnost.apk | grep -m1 'SHA-256 digest' | awk '{print $NF}')
          echo "ожидается: $EXPECTED"
          echo "в APK:     $ACTUAL"
          [ "$EXPECTED" = "$ACTUAL" ]

      - uses: actions/upload-artifact@v4
        with:
          name: gorynych-dostupnost-apk
          path: gorynych-dostupnost.apk

      - name: Удалить ключи с сервера сборки
        if: always()
        run: rm -f "$RUNNER_TEMP/sideload.jks" "$RUNNER_TEMP/upload.jks"

      - name: Публикация в Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Сборка ${{ github.run_number }}
          body: "APK: gorynych-dostupnost.apk. Нормы: СП 59.13330.2020, СП 140.13330.2024."
          files: |
            gorynych-dostupnost.apk
            gorynych-dostupnost-google-play.aab
