<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F3864">
<title>Горыныч: проверка доступности</title>
<style>
:root{
  --bg:#f4f6fa;--card:#fff;--ink:#14213d;--muted:#5b6678;--line:#d5dbe6;--brand:#1F3864;--brand-ink:#fff;
  --ok-bg:#d8f3dc;--ok:#1b5e20;--bad-bg:#ffd9d9;--bad:#9b1c1c;--rx-bg:#fff0c2;--rx:#7a5200;--nn-bg:#e5e7eb;--nn:#374151;
  --warn-bg:#fdecdc;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f1624;--card:#18223a;--ink:#eef2fb;--muted:#a3adc2;--line:#2f3b58;--brand:#5b86d6;--brand-ink:#0b1220;
  --ok-bg:#16391f;--ok:#9be3a8;--bad-bg:#4a1c1c;--bad:#ffb3b3;--rx-bg:#4a3a0f;--rx:#ffe08a;--nn-bg:#2b3447;--nn:#d1d5db;--warn-bg:#3d2a17}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:18px;line-height:1.35}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
header{background:var(--brand);color:var(--brand-ink);padding:14px 16px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:20px}
header .sub{font-size:13px;opacity:.9}
main{padding:12px 16px;max-width:720px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px}
label{display:block;font-weight:600;margin:10px 0 4px}
select,input,textarea,button{font:inherit;color:inherit}
select,input[type=text],input[type=number],input[type=search],textarea{width:100%;min-height:52px;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--card)}
textarea{min-height:80px}
select:focus,input:focus,textarea:focus,button:focus-visible{outline:3px solid var(--brand);outline-offset:1px}
button{min-height:56px;padding:12px 16px;border-radius:14px;border:2px solid var(--brand);background:var(--card);font-weight:700;cursor:pointer}
button.primary{background:var(--brand);color:var(--brand-ink)}
button.small{min-height:44px;padding:8px 12px;font-size:16px}
button.danger{border-color:var(--bad);color:var(--bad)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 140px}
.badge{display:inline-block;padding:4px 10px;border-radius:999px;font-weight:700;font-size:15px}
.ok{background:var(--ok-bg);color:var(--ok)}
.bad{background:var(--bad-bg);color:var(--bad)}
.relax{background:var(--rx-bg);color:var(--rx)}
.nonorm{background:var(--nn-bg);color:var(--nn)}
.old{background:var(--rx-bg);color:var(--rx)}
.cond{margin-top:8px;font-size:16px;font-weight:400}
.result{border-radius:14px;padding:14px;margin:12px 0;font-size:19px;font-weight:700}
.result small{display:block;font-weight:400;font-size:16px;margin-top:6px}
.warn{background:var(--warn-bg);border-radius:10px;padding:8px 10px;font-size:15px;margin-top:8px}
.muted{color:var(--muted);font-size:15px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1 1 0;min-width:0;border:none;border-radius:0;min-height:68px;padding:8px 2px;font-size:13px;background:transparent;font-weight:600;color:var(--muted)}
nav button[aria-current=true]{color:var(--brand);box-shadow:inset 0 3px 0 var(--brand)}
.item{border-top:1px solid var(--line);padding:10px 0}
.item:first-child{border-top:none}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.thumbs img{width:76px;height:76px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.stat{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.hidden{display:none}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px}
.overlay img{max-width:100%;max-height:75vh;border-radius:8px}
pre{white-space:pre-wrap;word-break:break-word;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:14px;max-height:50vh;overflow:auto}

header{padding-top:calc(14px + env(safe-area-inset-top))}
[hidden]{display:none!important}
.vh{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;overflow:hidden}
.btnlike{position:relative;display:flex;align-items:center;justify-content:center;text-align:center;min-height:56px;padding:12px 16px;border-radius:14px;border:2px solid var(--brand);background:var(--card);color:var(--ink);font-weight:700;cursor:pointer;margin:0}
.btnlike.small{min-height:44px;padding:8px 12px;font-size:16px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:108px;min-height:0;margin:0;padding:4px;border:2px dashed var(--line);border-radius:12px;background:var(--bg);color:var(--ink);cursor:pointer;overflow:hidden;text-align:center;font-weight:600}
.tile .plus{font-size:30px;line-height:1;color:var(--brand);font-weight:300}
.tile .tl{font-size:13px;line-height:1.2}
.tile.has{border-style:solid;padding:0}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile .tcap{position:absolute;left:0;right:0;top:0;padding:4px 6px 14px;font-size:12px;font-weight:700;color:#fff;background:linear-gradient(#000000b0,transparent);text-align:left}
.chk{display:flex;align-items:center;gap:10px;font-weight:400;font-size:16px;margin-top:10px}
.chk input{width:24px;height:24px;margin:0;flex:0 0 auto}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{min-height:40px;padding:6px 12px;border-radius:999px;font-size:15px;font-weight:600;border:2px solid var(--line)}
.geo{font-size:15px;margin-top:6px}
.geo a{color:var(--brand);font-weight:600}
.aclist{display:flex;flex-direction:column;border:2px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden;margin-top:6px;box-shadow:0 6px 18px #0000001f}
.aci{all:unset;box-sizing:border-box;display:flex;flex-direction:column;gap:2px;padding:10px 12px;cursor:pointer;min-height:52px;justify-content:center}
.aci+.aci{border-top:1px solid var(--line)}
.aci:active,.aci:focus-visible{background:var(--bg)}
.acn{font-size:17px;font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acs{font-size:14px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acwait{padding:10px 12px;white-space:normal}
.ach{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:8px 12px 5px;background:var(--bg)}
.mapx{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column}
.mapbar{padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:var(--card);border-bottom:1px solid var(--line)}
.maphint{margin:0;font-size:14px;color:var(--muted)}
.mapaddr{margin:2px 0 0;font-size:17px;font-weight:700;min-height:1.4em}
.mapwrap{position:relative;flex:1 1 auto;min-height:0}
#map,#map2{position:absolute;inset:0;background:#e9eef3}
.pin{position:absolute;left:50%;top:50%;transform:translate(-50%,-100%);z-index:500;pointer-events:none;display:flex;flex-direction:column;align-items:center}
.pin svg{display:block;filter:drop-shadow(0 2px 2px #00000040)}
@media (prefers-reduced-motion:no-preference){.pin svg{transition:transform .15s}}
.pin.up svg{transform:translateY(-10px)}
.pin .shadow{position:absolute;bottom:-3px;width:10px;height:4px;border-radius:50%;background:#00000055}
.mapbtns{display:flex;gap:8px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line)}
.mapbtns button{flex:1 1 0;padding:12px 6px}
.overlay img{max-height:60vh}
.vcap{color:#fff;font-weight:700;font-size:18px}
</style>
</head>
<body>
<header>
  <h1>Горыныч: проверка доступности</h1>
  <div class="sub" id="appver">Версия: разработка</div>
  <div class="sub" id="normsub"></div>
</header>
<main id="app"></main>
<nav id="nav" aria-label="Разделы"></nav>
<div class="mapx" id="mapx" hidden role="dialog" aria-label="Выбор места на карте">
  <div class="mapbar"><p class="maphint">Двигайте карту, чтобы метка встала на место</p><p class="mapaddr" id="mapAddr"></p></div>
  <div class="mapwrap"><div id="map"></div><div class="pin" id="pin" aria-hidden="true"><svg viewBox="0 0 32 44" width="40" height="55"><path d="M16 0C7.2 0 0 7 0 15.7 0 27.5 16 44 16 44s16-16.5 16-28.3C32 7 24.8 0 16 0z" fill="#c0352b"/><circle cx="16" cy="15.5" r="6.5" fill="#ffffff"/></svg><span class="shadow"></span></div></div>
  <div class="mapbtns"><button type="button" id="mapMe">Я здесь</button><button type="button" id="mapCancel">Отмена</button><button type="button" class="primary" id="mapOk">Готово</button></div>
</div>
<div class="mapx" id="mapall" hidden role="dialog" aria-label="Замеры на карте">
  <div class="mapbar"><p class="mapaddr" id="allCount"></p><p class="maphint">Зелёный — соответствует, красный — нет, жёлтый — при условии или до 2016 года, серый — нет нормы</p></div>
  <div class="mapwrap"><div id="map2"></div></div>
  <div class="mapbtns"><button type="button" class="primary" id="allClose">Закрыть</button></div>
</div>

// если что-то сломается при запуске — показать ошибку, а не пустой экран

  a.innerHTML = `<div class="card"><b>Приложение не запустилось.</b><p class="muted">${String(e.message||e.error||"ошибка").replace(/[<>&]/g,"")}</p><p class="muted">Сделайте снимок экрана и отправьте разработчику.</p></div>`; });

/* ==== Android-обёртка (Capacitor): отправка файлов через системное меню ==== */
const CAP = window.Capacitor;
const isNative = !!(CAP && CAP.isNativePlatform && CAP.isNativePlatform() && typeof CAP.nativePromise==="function");
// Библиотеки @capacitor/core в приложении нет (registerPlugin берётся из неё), поэтому плагины зовём через мост напрямую
const nCall = (plugin, method, opts)=>CAP.nativePromise(plugin, method, opts||{});
const NShare = isNative ? { share:o=>nCall("Share","share",o) } : null;
const NFs = isNative ? { writeFile:o=>nCall("Filesystem","writeFile",o) } : null;
function blobToB64(blob){ return new Promise(res=>{ const r = new FileReader(); r.onload = ()=>res(String(r.result).split(",")[1]); r.readAsDataURL(blob); }); }
async function nativeShareBlob(name, blob){
  const data = await blobToB64(blob);
  const w = await NFs.writeFile({ path:name, data, directory:"CACHE" });
  await NShare.share({ title:name, url:w.uri });
}

const KEY = "gorynych_dostup_v1";
let db = { objects: [], records: [], overrides: {}, currentObj: null, settings: {stamp:true} };
function load(){ try{ const s = localStorage.getItem(KEY); if(s) db = Object.assign(db, JSON.parse(s)); }catch(e){}
  db.objects.forEach(o=>{ if(o.bstatus===undefined){ o.bstatus = o.existing ? "unknown" : "new"; } });
  db.settings = Object.assign({stamp:true}, db.settings||{}); }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){ alert("Не удалось сохранить: память браузера недоступна."); } }

/* Фото в IndexedDB */
let idb = null;
function openIDB(){ return new Promise((res)=>{ setTimeout(res, 4000); try{ const r = indexedDB.open("gorynych_photos",1);
  r.onupgradeneeded = ()=>r.result.createObjectStore("p");
  r.onsuccess = ()=>{ idb=r.result; res(); }; r.onerror = ()=>res(); }catch(e){ res(); } }); }
function putPhoto(id, blob){ return new Promise((res)=>{ if(!idb) return res(false);
  const t = idb.transaction("p","readwrite"); t.objectStore("p").put(blob,id); t.oncomplete=()=>res(true); t.onerror=()=>res(false); }); }
function getPhoto(id){ return new Promise((res)=>{ if(!idb) return res(null);
  const q = idb.transaction("p").objectStore("p").get(id); q.onsuccess=()=>res(q.result||null); q.onerror=()=>res(null); }); }
function delPhoto(id){ if(!idb) return; idb.transaction("p","readwrite").objectStore("p").delete(id); }
function resize(file, max=1280){ return new Promise((res)=>{ const img = new Image(); const u = URL.createObjectURL(file);
  img.onload = ()=>{ const k = Math.min(1, max/Math.max(img.width,img.height)); const c = document.createElement("canvas");
    c.width = Math.round(img.width*k); c.height = Math.round(img.height*k); c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    c.toBlob(b=>{ URL.revokeObjectURL(u); res(b||file); }, "image/jpeg", .82); };
  img.onerror = ()=>{ URL.revokeObjectURL(u); res(file); }; img.src = u; }); }

const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => (n==null||n==="")?"":String(n).replace(".",",");
const num = s => { const v = parseFloat(String(s).replace(",",".").trim()); return isFinite(v)?v:null; };
function rule(id){ const r = RULES.find(x=>x.id===id); if(!r) return null; const o = db.overrides[id]; return o ? Object.assign({}, r, o) : r; }
function allRules(){ return RULES.map(r=>rule(r.id)); }
function normText(r){
  if(r.min==null && r.max==null) return "нет значения нормы";
  if(r.max==null) return "не менее "+fmt(r.min)+" "+r.unit;
  if(r.min==null) return "не более "+fmt(r.max)+" "+r.unit;
  if(r.min===r.max) return "ровно "+fmt(r.min)+" "+r.unit;
  return "от "+fmt(r.min)+" до "+fmt(r.max)+" "+r.unit;
}
function relaxText(r){
  if(r.amin==null && r.amax==null) return "";
  const lo = r.amin!=null?r.amin:r.min, hi = r.amax!=null?r.amax:r.max;
  if(hi==null) return "не менее "+fmt(lo)+" "+r.unit;
  if(lo==null) return "не более "+fmt(hi)+" "+r.unit;
  return "от "+fmt(lo)+" до "+fmt(hi)+" "+r.unit;
}
function check(r, v, o){
  if(r.min==null && r.max==null) return "nonorm";
  const within = (lo,hi)=>(lo==null||v>=lo-1e-9)&&(hi==null||v<=hi+1e-9);
  if(within(r.min,r.max)) return "ok";
  if(o && o.bstatus==="old") return "old";
  if(bRelax(o) && (r.amin!=null||r.amax!=null)){
    const lo = r.amin!=null?r.amin:r.min, hi = r.amax!=null?r.amax:r.max;
    if(within(lo,hi)) return "relax";
  }
  return "bad";
}

function resultBadge(k){ return `<span class="badge ${RES[k][1]}">${RES[k][0]}</span>`; }

  const k = effKind(k0, cond);
  let extra = "";
  if(k0==="relax") extra = `<div class="cond"><b>Условие допуска:</b> ${esc(r.cond||r.note||"условие не указано — уточните по тексту СП")}<br>Допустимое отклонение для реконструкции: ${esc(relaxText(r))}.</div>`;
  if(k==="bad2") extra += `<small>Допуск возможен только при выполнении условия.</small>`;
  if(k==="old") extra = `<small>Здание введено до 01.07.2016 и не реконструировалось: отклонение — не нарушение размеров, а повод рекомендовать приспособление (ст. 15 закона № 181-ФЗ, «разумное приспособление»).</small>`;
  if(k==="bad" && o && o.bstatus==="new" && (r.amin!=null||r.amax!=null)) extra = `<small>Для нового строительства смягчения не применяются. Если это была реконструкция, измените статус здания.</small>`;
  if(k==="nonorm") extra = `<small>Найдите норму и впишите её на вкладке «Нормы».</small>`;
  let w = r.status!=="ok" ? `<div class="warn">${r.status==="chk"?"Норма требует сверки с полным текстом СП.":"Значение нормы не внесено."}</div>` : "";
  if(o && o.bstatus==="unknown") w += `<div class="warn">Статус здания не уточнён: проверка идёт как для реконструкции. Уточните, когда построено или реконструировано здание.</div>`;
  return `<div class="result ${RES[k][1]}">${RES[k][0]}<small>Факт: ${fmt(v)} ${esc(r.unit)}. Требуется: ${esc(normText(r))}.<br>${esc(r.clause)}, ${esc(r.doc)}</small>${extra}${w}</div>`;
}

/* ==== СОСТОЯНИЕ UI ==== */
let tab = "measure";
function newDraft(group){ return { group, ruleId:"", value:"", comment:"", exp:"", fix:"", slots:{}, geo:null, place:"", cond:null }; }
let draft = newDraft("");
let logFilter = "all";
const app = document.getElementById("app");
const TABS = [["measure","Замер"],["log","Журнал"],["ramp","Пандус"],["export","Экспорт"],["norms","Нормы"]];


/* Подсказки «что реально сделать» — типовые решения, человек выбирает и дописывает */

  "Лифт":["Перенести кнопки на доступную высоту","Отрегулировать точность остановки","Установить подъёмную платформу"],
  "Улица":["Выровнять покрытие, заделать швы","Установить освещение","Обустроить место отдыха"]
};
function fixChips(group){ const list = [...(FIXES[group] || (group.indexOf("Улица")===0 ? FIXES["Улица"] : [])), "Помощь персонала (разумное приспособление)"];
  return list.map(t=>`<button type="button" class="chip" data-fix="${esc(t)}">${esc(t)}</button>`).join(""); }
function bindChips(box, ta, set){ box.querySelectorAll("[data-fix]").forEach(b=>b.onclick=()=>{ const t = b.dataset.fix, v = ta.value.trim(); if(v.includes(t)) return; ta.value = v ? v+"; "+t : t; set(ta.value); }); }
function draftGeoHTML(o){ return draft.geo||draft.place ? geoLine(draft.geo, draft.place)+`<button type="button" class="small" id="dgeox" style="margin-top:6px">Убрать место</button>`
  : `<p class="muted" style="margin:4px 0 0">Не отмечено${o.geo?" — в отчёте будет место объекта":""}.</p>`; }

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function curObj(){ return db.objects.find(o=>o.id===db.currentObj)||null; }
function groups(){ return [...new Set(RULES.map(r=>r.group))]; }

function renderNav(){
  const nav = document.getElementById("nav");
  nav.innerHTML = TABS.map(([k,t])=>`<button data-tab="${k}" ${tab===k?'aria-current="true"':''}>${t}</button>`).join("");
  nav.querySelectorAll("button").forEach(b=>b.onclick=()=>{ tab=b.dataset.tab; render(); window.scrollTo(0,0); });
}
function render(){
  document.getElementById("normsub").textContent = "Нормы: "+NORMS_VERSION;
  renderNav();
  ({measure:renderMeasure, log:renderLog, ramp:renderRamp, export:renderExport, norms:renderNorms})[tab]();
}

/* ---- Замер ---- */
function renderMeasure(){
  const o = curObj();
  let h = `<div class="card"><label for="objsel">Объект</label>
    <select id="objsel"><option value="">— выберите объект —</option>${db.objects.map(x=>`<option value="${x.id}" ${x.id===db.currentObj?"selected":""}>${esc(x.name)}</option>`).join("")}</select>
    <div class="row" style="margin-top:10px"><button id="newobj" class="small">Новый объект</button>${o?`<button id="editobj" class="small">Изменить</button>`:""}</div>
    ${o?`<p class="muted">${esc(o.address||"")}<br>${esc(BST[o.bstatus]||"")}</p>`:""}</div>`;
  if(!o){ h += `<div class="card">Сначала добавьте объект: название, адрес и пометка, существующее ли здание.</div>`; app.innerHTML=h; bindObj(); return; }
  const gs = groups();
  const rs = allRules().filter(r=>!draft.group||r.group===draft.group);
  const cur = draft.ruleId ? rule(draft.ruleId) : null;
  h += `<div class="card"><label for="grp">Раздел</label>
    <select id="grp"><option value="">Все разделы</option>${gs.map(g=>`<option ${g===draft.group?"selected":""}>${esc(g)}</option>`).join("")}</select>
    <label for="rul">Параметр</label>
    <select id="rul"><option value="">— выберите параметр —</option>${rs.map(r=>`<option value="${r.id}" ${r.id===draft.ruleId?"selected":""}>${esc(r.name)} (${esc(r.unit)})</option>`).join("")}</select>`;
  if(cur){
    h += `<p class="muted">Норма: ${esc(normText(cur))} · ${esc(cur.clause)}, ${esc(cur.doc)}</p>
    <label for="val">Факт, ${esc(cur.unit)}</label>
    <input id="val" type="text" inputmode="decimal" autocomplete="off" placeholder="например 0,85" value="${esc(draft.value)}">
    <div id="live"></div>
    <label>Место замера</label><div id="dgeo"></div>
    <div class="row" style="margin-top:6px"><button id="dhere" class="small" type="button">📍 Я здесь</button><button id="dmap" class="small" type="button">На карте</button></div>
    <label>Подтверждающие фото</label>${tilesHTML("draft")}
    <label class="chk"><input type="checkbox" id="stampChk" ${db.settings.stamp?"checked":""}> Подписывать на фото дату и место</label>
    <label for="exp">Опыт эксперта: как это на коляске</label><textarea id="exp" placeholder="Например: дверь тяжёлая, одному не открыть">${esc(draft.exp)}</textarea>
    <label for="fix">Что реально сделать</label><textarea id="fix" placeholder="Что может сделать объект или мэрия">${esc(draft.fix)}</textarea>
    <div class="chips" id="fixchips">${fixChips(cur.group)}</div>
    <label for="cmt">Комментарий</label><textarea id="cmt">${esc(draft.comment)}</textarea>
    <div style="margin-top:14px"><button id="saveM" class="primary" style="width:100%">Сохранить замер</button></div>`;
  }
  h += `</div>`;
  app.innerHTML = h; bindObj();
  document.getElementById("grp").onchange = e=>{ draft.group = e.target.value; draft.ruleId=""; draft.value=""; draft.cond=null; renderMeasure(); };
  document.getElementById("rul").onchange = e=>{ draft.ruleId = e.target.value; draft.value=""; draft.cond=null; renderMeasure(); };
  if(cur){
    const val = document.getElementById("val"), live = document.getElementById("live");
    const upd = ()=>{ draft.value = val.value; const v = num(val.value);
      if(v==null){ live.innerHTML=""; return; }
      const k0 = check(cur,v,o);
      let html = resultBox(k0,cur,v,o,draft.cond);
      if(k0==="relax") html += `<p class="muted" style="margin-bottom:4px">Проверьте условие на месте и отметьте:</p><div class="row"><button type="button" class="${draft.cond===true?"primary":""}" data-c="1">Условие выполнено</button><button type="button" class="${draft.cond===false?"primary":""}" data-c="0">Условие не выполнено</button></div>`;
      live.innerHTML = html;
      live.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{ draft.cond = b.dataset.c==="1"; upd(); }); };
    val.oninput = upd; upd();
    document.getElementById("cmt").oninput = e=>{ draft.comment = e.target.value; };
    fillImgs(app);
    const sg = ()=>{ byId("dgeo").innerHTML = draftGeoHTML(o); const x = byId("dgeox"); if(x) x.onclick = ()=>{ draft.geo = null; draft.place = ""; sg(); }; };
    sg();
    byId("dhere").onclick = e=>hereFill(e.currentTarget, it=>{ draft.geo = it.geo; draft.place = it.address; sg(); });
    byId("dmap").onclick = ()=>openPicker(draft.geo||o.geo, (g,a)=>{ draft.geo = g; draft.place = a||""; sg(); });
    byId("stampChk").onchange = e=>{ db.settings.stamp = e.target.checked; save(); };
    byId("exp").oninput = e=>{ draft.exp = e.target.value; };
    const fx = byId("fix"); fx.oninput = e=>{ draft.fix = e.target.value; };
    bindChips(byId("fixchips"), fx, t=>{ draft.fix = t; });
    byId("saveM").onclick = ()=>{
      const v = num(val.value); if(v==null){ alert("Введите число."); val.focus(); return; }
      const k = check(cur,v,o), slots = Object.assign({}, draft.slots);
      db.records.unshift({ id:uid(), objId:o.id, ruleId:cur.id, value:v, result:k, ts:Date.now(), comment:draft.comment.trim(), exp:draft.exp.trim(), fix:draft.fix.trim(),
        geo:draft.geo, place:draft.place, slots, photos:Object.values(slots).filter(Boolean), cond:(k==='relax'?draft.cond:null) });
      save(); draft = newDraft(draft.group);
      toast("Сохранено"); renderMeasure();
    };
  }
}
function bindObj(){
  const s = document.getElementById("objsel"); if(s) s.onchange = e=>{ db.currentObj = e.target.value||null; save(); renderMeasure(); };
  const n = document.getElementById("newobj"); if(n) n.onclick = ()=>objForm(null);
  const e = document.getElementById("editobj"); if(e) e.onclick = ()=>objForm(curObj());
}
function objForm(o){
  app.innerHTML = `<div class="card"><h2 style="margin-top:0">${o?"Изменить объект":"Новый объект"}</h2>
    <label for="on">Название</label><input id="on" type="text" data-ac="name" autocomplete="off" value="${esc(o?o.name:"")}" placeholder="Поликлиника № … — подскажу по карте">
    <label for="oa">Адрес</label><input id="oa" type="text" data-ac="addr" autocomplete="off" value="${esc(o?o.address:"")}" placeholder="ул. …, дом">
    <div id="ogeo"></div>
    <div class="row" style="margin-top:6px"><button type="button" class="small" id="ohere">📍 Я здесь</button><button type="button" class="small" id="omap">На карте</button></div>
    <label for="oe">Строительство или реконструкция завершены позже 1 июля 2016 года?</label>
    <select id="oe">${[["new","Да — новое строительство"],["recon","Да — реконструкция"],["old","Нет — раньше, с тех пор не реконструировалось"],["unknown","Не знаю (уточню)"]].map(([k,t])=>`<option value="${k}" ${((o?o.bstatus:"unknown")===k)?"selected":""}>${t}</option>`).join("")}</select>
    <div class="row"><button class="primary" id="osave">Сохранить</button><button id="ocancel">Отмена</button></div>
    ${o?`<div style="margin-top:12px"><button class="danger small" id="odel">Удалить объект и его замеры</button></div>`:""}</div>`;
  let fg = o ? (o.geo||null) : null;
  const og = ()=>{ byId("ogeo").innerHTML = fg ? geoLine(fg) : `<p class="muted" style="margin:4px 0 0">Место не отмечено. Начните вводить название или адрес — подскажу по карте. Или нажмите «Я здесь».</p>`; };
  og();
  const onm = byId("on"), oad = byId("oa");
  onm._acPick = it=>{ if(it.name) onm.value = it.name; if(it.address) oad.value = it.address; if(it.geo){ fg = it.geo; og(); } };
  oad._acPick = it=>{ if(it.address) oad.value = it.address; if(it.geo){ fg = it.geo; og(); } };
  byId("ohere").onclick = e=>hereFill(e.currentTarget, it=>{ if(it.address) oad.value = it.address; fg = it.geo; og(); });
  byId("omap").onclick = ()=>openPicker(fg, (g,a)=>{ fg = g; if(a) oad.value = a; og(); });
  document.getElementById("ocancel").onclick = ()=>renderMeasure();
  document.getElementById("osave").onclick = ()=>{
    const name = document.getElementById("on").value.trim(); if(!name){ alert("Введите название."); return; }
    const data = { name, address:document.getElementById("oa").value.trim(), bstatus:document.getElementById("oe").value, geo:fg }; data.existing = data.bstatus!=="new";
    if(o) Object.assign(o,data); else { const n = Object.assign({id:uid()},data); db.objects.push(n); db.currentObj = n.id; }
    save(); renderMeasure();
  };
  const d = document.getElementById("odel"); if(d) d.onclick = ()=>{ if(!confirm("Удалить объект и все его замеры?")) return;
    db.records.filter(r=>r.objId===o.id).forEach(r=>r.photos.forEach(delPhoto));
    db.records = db.records.filter(r=>r.objId!==o.id); db.objects = db.objects.filter(x=>x.id!==o.id);
    if(db.currentObj===o.id) db.currentObj = null; save(); renderMeasure(); };
}

/* ---- Журнал ---- */
function recView(r){
  const ru = rule(r.ruleId) || {name:r.ruleId,unit:"",clause:"",doc:""};
  const ob = db.objects.find(o=>o.id===r.objId);
  const baseK = (ru.min!==undefined && ob) ? check(ru, r.value, ob) : r.result;
  return {ru, ob, baseK, k:effKind(baseK, r.cond)};
}
function renderLog(){
  const list = db.records.filter(r=>logFilter==="all"||r.objId===logFilter);
  const cnt = {ok:0,bad:0,relax:0,relaxok:0,old:0,nonorm:0};
  const items = list.map(r=>{ const v = recView(r); cnt[v.k==="bad2"?"bad":v.k]++; return {r,v}; });
  let h = `<div class="card"><label for="lf">Показать</label><select id="lf"><option value="all">Все объекты</option>${db.objects.map(o=>`<option value="${o.id}" ${logFilter===o.id?"selected":""}>${esc(o.name)}</option>`).join("")}</select>
  <div class="stat"><span class="badge ok">соотв.: ${cnt.ok}</span><span class="badge bad">не соотв.: ${cnt.bad}</span><span class="badge relax">ждут проверки условия: ${cnt.relax}</span><span class="badge relax">допустимо: ${cnt.relaxok}</span><span class="badge old">до 2016: ${cnt.old}</span><span class="badge nonorm">нет нормы: ${cnt.nonorm}</span></div>
  ${items.length?`<button id="lmapall" class="small" style="width:100%">🗺 Замеры на карте</button>`:""}</div>`;
  if(!items.length) h += `<div class="card muted">Замеров пока нет.</div>`;
  else h += `<div class="card">`+items.map(({r,v})=>`<div class="item" data-id="${r.id}">
    <div><b>${esc(v.ru.name)}</b></div>
    <div class="muted">${esc(v.ob?v.ob.name:"?")} · ${new Date(r.ts).toLocaleString("ru-RU",{dateStyle:"short",timeStyle:"short"})}</div>
    <div>Факт: <b>${fmt(r.value)} ${esc(v.ru.unit)}</b> · ${resultBadge(v.k)}</div>
    <div class="muted">Норма: ${esc(v.ru.min!==undefined?normText(v.ru):"")} · ${esc(v.ru.clause)}, ${esc(v.ru.doc)}</div>
    ${v.baseK==="relax"?`<div class="warn"><b>Условие допуска:</b> ${esc(v.ru.cond||"не указано")}</div><div class="row" style="margin-top:6px"><button class="small ${r.cond===true?"primary":""}" data-cond="1" data-rid="${r.id}">Условие выполнено</button><button class="small ${r.cond===false?"primary":""}" data-cond="0" data-rid="${r.id}">Не выполнено</button></div>`:""}
    ${geoLine(r.geo, r.place)}
    ${r.exp?`<div><b>Опыт эксперта:</b> ${esc(r.exp)}</div>`:""}
    ${r.fix?`<div><b>Что сделать:</b> ${esc(r.fix)}</div>`:""}
    ${r.comment?`<div>${esc(r.comment)}</div>`:""}
    ${tilesHTML(r.id)}
    <div class="row" style="margin-top:6px"><button class="small" data-edit="${r.id}">Изменить</button><button class="small danger" data-del="${r.id}">Удалить</button></div></div>`).join("")+`</div>`;
  app.innerHTML = h;
  document.getElementById("lf").onchange = e=>{ logFilter = e.target.value; renderLog(); };
  app.querySelectorAll("[data-cond]").forEach(b=>b.onclick=()=>{ const r = db.records.find(x=>x.id===b.dataset.rid); if(r){ r.cond = b.dataset.cond==="1"; save(); renderLog(); } });
  app.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{ if(!confirm("Удалить замер?")) return;
    const r = db.records.find(x=>x.id===b.dataset.del); if(r) (r.photos||[]).forEach(forgetPhoto);
    db.records = db.records.filter(x=>x.id!==b.dataset.del); save(); renderLog(); });
  fillImgs(app);
  app.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{ editRec(b.dataset.edit); window.scrollTo(0,0); });
  const lm = byId("lmapall"); if(lm) lm.onclick = ()=>openMapAll(items);
}
function editRec(id){ const r = db.records.find(x=>x.id===id); if(!r) return; const v = recView(r);
  app.innerHTML = `<div class="card"><h2 style="margin-top:0">${esc(v.ru.name)}</h2><p class="muted">${esc(v.ob?v.ob.name:"")} · ${new Date(r.ts).toLocaleString("ru-RU",{dateStyle:"short",timeStyle:"short"})}</p>
   <label for="rv">Факт, ${esc(v.ru.unit)}</label><input id="rv" type="text" inputmode="decimal" autocomplete="off" value="${fmt(r.value)}">
   <label>Место замера</label><div id="rgeo"></div>
   <div class="row" style="margin-top:6px"><button type="button" class="small" id="rhere">📍 Я здесь</button><button type="button" class="small" id="rmap">На карте</button></div>
   <label>Подтверждающие фото</label>${tilesHTML(r.id)}
   <label for="rexp">Опыт эксперта: как это на коляске</label><textarea id="rexp">${esc(r.exp||"")}</textarea>
   <label for="rfix">Что реально сделать</label><textarea id="rfix">${esc(r.fix||"")}</textarea><div class="chips" id="rchips">${fixChips(v.ru.group||"")}</div>
   <label for="rcmt">Комментарий</label><textarea id="rcmt">${esc(r.comment||"")}</textarea>
   <p class="muted">Фото сохраняются сразу. Остальное — кнопкой «Сохранить».</p>
   <div class="row" style="margin-top:12px"><button class="primary" id="rsv">Сохранить</button><button id="rcn">Назад</button></div></div>`;
  fillImgs(app);
  let g = r.geo||null, pl = r.place||"";
  const sg = ()=>{ byId("rgeo").innerHTML = g||pl ? geoLine(g, pl)+`<button type="button" class="small" id="rgeox" style="margin-top:6px">Убрать место</button>`
    : `<p class="muted" style="margin:4px 0 0">Не отмечено${v.ob&&v.ob.geo?" — в отчёте будет место объекта":""}.</p>`;
    const x = byId("rgeox"); if(x) x.onclick = ()=>{ g = null; pl = ""; sg(); }; };
  sg();
  byId("rhere").onclick = e=>hereFill(e.currentTarget, it=>{ g = it.geo; pl = it.address; sg(); });
  byId("rmap").onclick = ()=>openPicker(g||(v.ob&&v.ob.geo), (gg,a)=>{ g = gg; pl = a||""; sg(); });
  const fx = byId("rfix"); bindChips(byId("rchips"), fx, ()=>{});
  byId("rcn").onclick = renderLog;
  byId("rsv").onclick = ()=>{ const val = num(byId("rv").value); if(val==null){ alert("Введите число."); return; }
    r.value = val; if(v.ob && v.ru.min!==undefined) r.result = check(v.ru, val, v.ob); if(r.result!=="relax") r.cond = null;
    r.geo = g; r.place = pl; r.exp = byId("rexp").value.trim(); r.fix = fx.value.trim(); r.comment = byId("rcmt").value.trim();
    save(); toast("Сохранено"); renderLog(); };
}

async function showPhoto(id, ctx){
  const b = await getPhoto(id); if(!b) return; const u = URL.createObjectURL(b);

const byId = id=>document.getElementById(id);
const NSK = {lat:55.0302, lon:82.9204}; // центр Новосибирска, пока нет своего места
function getFix(){ return new Promise(res=>{ if(!navigator.geolocation) return res(null);
  navigator.geolocation.getCurrentPosition(p=>res({lat:p.coords.latitude, lon:p.coords.longitude, acc:p.coords.accuracy}), ()=>res(null), {enableHighAccuracy:true, timeout:12000, maximumAge:30000}); }); }
function dist(a,b){ const R=6371000, d=Math.PI/180, dl=(b.lat-a.lat)*d, dn=(b.lon-a.lon)*d;
  const x=Math.sin(dl/2)**2+Math.cos(a.lat*d)*Math.cos(b.lat*d)*Math.sin(dn/2)**2; return 2*R*Math.asin(Math.min(1,Math.sqrt(x))); }
const fmtDist = d => d<1000 ? Math.max(10,Math.round(d/10)*10)+" м" : (d/1000).toFixed(d<10000?1:0).replace(".",",")+" км";

  return `<div class="geo">📍 ${place?esc(place)+" · ":""}${geoTxt(g)}${g.manual?" (на карте)":g.acc?" (±"+Math.round(g.acc)+" м)":""} · <a href="${mapLink(g)}" target="_blank" rel="noopener">открыть карту</a></div>`; }
function fetchJSON(u, ms=7000){ const c = window.AbortController ? new AbortController() : null; const t = setTimeout(()=>{ if(c) c.abort(); }, ms);
  return fetch(u, c?{signal:c.signal}:{}).then(r=>{ clearTimeout(t); if(!r.ok) throw new Error("http "+r.status); return r.json(); }, e=>{ clearTimeout(t); throw e; }); }
function photonAddr(p){ return { street:[p.street,p.housenumber].filter(Boolean).join(", "), city:p.city||p.town||p.village||p.locality||p.district||"" }; }

async function reverseGeo(g){
  try{ const j = await fetchJSON("https://nominatim.openstreetmap.org/reverse?format=jsonv2&accept-language=ru&zoom=18&addressdetails=1&lat="+g.lat+"&lon="+g.lon);
    const a = j && j.address;
    if(a){ const s = [a.road||a.pedestrian||a.footway||a.neighbourhood, a.house_number].filter(Boolean).join(", "); if(s) return s; } }catch(e){}
  try{ const j = await fetchJSON("https://photon.komoot.io/reverse?lang=default&lat="+g.lat+"&lon="+g.lon);
    const f = j && j.features && j.features[0];
    if(f){ const p = f.properties||{}, s = photonAddr(p).street || p.name || ""; if(s) return s; } }catch(e){}
  return null;
}
// сравнение текста: без регистра, ё и знаков; «ул.», «д.» и похожие слова не важны
function fold(s){ return (s||"").toLowerCase().replace(/ё/g,"е").replace(/[.,;:«»"'„“”()№#\-–—\/]/g," ").replace(/\s+/g," ").trim(); }
const STOP = {"ул":1,"улица":1,"д":1,"дом":1,"пр":1,"пр-т":1,"просп":1,"проспект":1,"пер":1,"переулок":1,"г":1,"город":1,"и":1,"на":1,"у":1};
const words = s => fold(s).split(" ").filter(w=>w&&!STOP[w]);
function lev(a,b){ let p=[]; for(let j=0;j<=b.length;j++) p[j]=j;
  for(let i=1;i<=a.length;i++){ const c=[i]; for(let j=1;j<=b.length;j++) c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1)); p=c; } return p[b.length]; }
// 2 = слово начинается так же, 1 = с опечаткой, 0 = нет
function wordHit(w, list){ let best=0; const num=/^\d/.test(w), max=w.length>=7?2:w.length>=4?1:0;
  for(const x of list){ if(x.indexOf(w)===0) return 2; if(num||!max) continue; if(lev(w,x.slice(0,w.length))<=max||lev(w,x)<=max) best=1; } return best; }
function fit(q, name){ const nw = words(name); let s = 0; for(const w of words(q)){ const h = wordHit(w,nw); if(!h) return -1; s += h; } return s; }
async function photonSearch(q, ref){
  const j = await fetchJSON("https://photon.komoot.io/api/?limit=10&lang=default&q="+encodeURIComponent(q)+"&lat="+ref.lat.toFixed(5)+"&lon="+ref.lon.toFixed(5)+"&zoom=14&location_bias_scale=0.1");
  const seen = {}, out = [];
  ((j&&j.features)||[]).forEach(f=>{ const p = f.properties||{}, c = f.geometry&&f.geometry.coordinates; if(!c) return;
    if(/^(country|state|region|county|continent)$/.test(p.type||"")) return;
    const g = {lat:+c[1], lon:+c[0]}, d = dist(ref,g); if(d>50000) return;
    const {street, city} = photonAddr(p); if(!p.name && !street) return;

// подсказки под полем: где вы сейчас, ваши прежние адреса, поиск по карте рядом

  if(AC.items.length) h += `<div class="ach">Ваши объекты</div>`+AC.items.map((o,i)=>`<button type="button" class="aci" role="option" data-i="u${i}"><span class="acn">${esc(o.address)}</span><span class="acs">${esc([o.name, o._d!=null?fmtDist(o._d):""].filter(Boolean).join(" · "))}</span></button>`).join("");

  else if(AC.ns==="done" && AC.near.length) h += `<div class="ach">На карте</div>`+AC.near.map((o,i)=>`<button type="button" class="aci" role="option" data-i="n${i}"><span class="acn">${esc(addr?(o.street||o.name):(o.name||o.street))}</span><span class="acs">${esc([addr?(o.street?o.name:""):(o.name?o.street:""), o.city, fmtDist(o.d)].filter(Boolean).join(" · "))}</span></button>`).join("");

const scopeRec = scope => scope==="draft" ? null : db.records.find(x=>x.id===scope);

// подпись внизу снимка: дата, место, координаты
async function stampImage(blob, lines){ const u = URL.createObjectURL(blob);

    const g = c.getContext("2d"); g.drawImage(img,0,0);
